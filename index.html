<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Mentea's Web</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 引入 Markdown 解析库 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    .card { border: 1px solid #eee; border-radius: 8px; padding: 20px; margin-bottom: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .cover-img { max-width: 100%; border-radius: 6px; display: block; margin: 15px 0; }
  </style>
</head>
<body>

  <h1>我的个人主页</h1>
  <div id="posts-container">正在加载文章与作品...</div>

  <script>
    async function loadPosts() {
      const container = document.getElementById('posts-container');
      
      try {
        // 1. 读取文章列表
        const res = await fetch('/posts.json');
        const posts = await res.json();
        
        container.innerHTML = '';

        // 2. 循环读取每篇 Markdown 并渲染
        for (const post of posts) {
          const postRes = await fetch(post.file);
          const rawText = await postRes.text();
          
          // 剥离开头的 YAML 配置（--- 之间的内容），只留正文
          const bodyText = rawText.replace(/^---[\s\S]*?---/, '').trim();
          const htmlContent = marked.parse(bodyText);

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <h2>${post.title}</h2>
            <small style="color: #888;">发布时间：${post.date}</small>
            ${post.cover ? `<img src="${post.cover}" class="cover-img" alt="封面">` : ''}
            <div class="content">${htmlContent}</div>
          `;
          container.appendChild(card);
        }
      } catch (err) {
        container.innerHTML = '<p>暂无内容或加载失败</p>';
      }
    }

    loadPosts();
  </script>
</body>
</html>
