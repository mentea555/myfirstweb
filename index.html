      root.setAttribute('data-theme', isLight ? 'light' : 'dark');

      const bgColor = tk.background || (isLight ? '#f6f7fb' : '#0f1117');
      const themeFg = isLight ? '#0f172a' : '#ffffff';

      if (tk.accent) {
        root.style.setProperty('--accent', tk.accent);
        root.style.setProperty('--accent-soft', hexToRgba(tk.accent, isLight ? 0.14 : 0.22));

        // ---- 强调色相关的「可读前景色」自动求解 ----
        // 1) 塞在强调色实心块上的文字（置顶徽章、选中的筛选按钮）
        root.style.setProperty('--accent-on', readableOn(tk.accent, '#ffffff', '#0b0d12'));

        // 2) 徽标底色 accent-soft 与描边。
        //    ⚠️ 徽标「文字色」不在这里设 —— 它现在是一个可调槽位（badgeColor），
        //    统一在下面处理，免得两处互相覆盖。
        root.style.setProperty('--accent-edge', hexToRgba(tk.accent, 0.45));
      } else {
        root.style.removeProperty('--accent');
        root.style.removeProperty('--accent-soft');
        root.style.removeProperty('--accent-on');
        root.style.removeProperty('--accent-ink');
        root.style.removeProperty('--accent-edge');
      }

      if (tk.background) {
        root.style.setProperty('--bg', tk.background);
      } else {
        root.style.removeProperty('--bg');
      }

      /* ---- 文字颜色（留空 = 跟随主题默认）----
         直接覆盖主题变量本身，这样页面上所有用 var(--text-*) 的地方
         一起生效，不需要到处加规则。 */
      const headingResolved = resolveTextColor(tk, settings, 'headingColor', 'heading_color');
      TEXT_COLOR_SLOTS.forEach(([camelKey, snakeKey, cssVar]) => {
        const val = resolveTextColor(tk, settings, camelKey, snakeKey);
        if (val) root.style.setProperty(cssVar, val);
        else root.style.removeProperty(cssVar);
      });

      /* 徽标文字色：放在这里（而不是上面的 if (tk.accent) 分支里）统一处理。
         因为它在两处都要生效：手动指定时覆盖，留空时回调自动值。 */
      const badgeRaw = resolveTextColor(tk, settings, BADGE_SLOT[0], BADGE_SLOT[1]);
      if (badgeRaw) {
        root.style.setProperty(BADGE_SLOT[2], badgeRaw);
      } else if (tk.accent) {
        // 留空 → 用强调色算「在半透明底上读得清」的那个颜色（这是原来的默认行为）
        const softSolid = mixHex(tk.accent, bgColor, isLight ? 0.14 : 0.22);
        root.style.setProperty(BADGE_SLOT[2], readableOn(softSolid, tk.accent, themeFg));
      } else {
        root.style.removeProperty(BADGE_SLOT[2]);
      }

      // 链接单独处理：留空时不直接拿强调色用 ——
      // 强调色常是深灰/低饱和的装饰色（主人现在就是 #2d2d2f），
      // 直接当正文链接会「字和背景一个色」。分两种情况：
      //   · 强调色本身在背景上够清楚  → 就用强调色（有品牌感）
      //   · 不够清楚                  → 退回标题色，至少能认出来是个链接
      const linkRaw = resolveTextColor(tk, settings, 'linkColor', 'link_color');
      if (linkRaw) {
        root.style.setProperty('--link-color', linkRaw);
      } else if (tk.accent && contrastRatio(tk.accent, bgColor) >= 3) {
        root.style.setProperty('--link-color', tk.accent);
      } else {
        root.style.setProperty('--link-color', headingResolved || themeFg);
      }

      root.style.setProperty('--font', FONTS[tk.font] || FONTS.jakarta);
      root.style.setProperty('--radius', num(tk.radius, 16) + 'px');
      root.style.setProperty('--page-width', num(tk.pageWidth, 900) + 'px');
      root.style.setProperty('--card-padding', num(tk.cardPadding, 26) + 'px');
      root.style.setProperty('--card-gap', num(tk.cardGap, 30) + 'px');
      root.style.setProperty('--line-height', num(tk.lineHeight, 178) / 100);
      root.style.setProperty('--title-scale', num(tk.titleScale, 100) / 100);
    }

    function applyBlockAlign(el, id, align, columns) {
      const mode = BLOCK_ALIGN_MODE[id] || 'text';
      if (mode === 'flex') {
        el.style.justifyContent = ({
          left: 'flex-start', center: 'center', right: 'flex-end', 'space-between': 'space-between'
        })[align] || 'flex-start';
      } else if (mode === 'stretch') {
        // 内容流是卡片容器，卡片必须整列撑满，宽度才不会参差不齐。
        // 单列是 flex 竖排，align-items 管横向；双列切成 grid 后它变成纵向。
        // 两种情况下都不能让卡片“各自居中” —— 那会把卡片缩成内容宽度
        // （单列下宽度参差），双列下则把短卡片在行内垂直居中，看着像没对齐。
        el.style.alignItems = num(columns, 1) >= 2 ? 'start' : 'stretch';
        el.style.justifyItems = '';
      } else {
        el.style.textAlign = ({ left: 'left', center: 'center', right: 'right' })[align] || 'left';
      }
    }

    function applyLayout(layout) {
      const container = $('blocks');
      const map = {};
      Array.from(container.children).forEach((el) => {
        if (el.dataset.block) map[el.dataset.block] = el;
      });

      const blocks = (layout && Array.isArray(layout.blocks)) ? layout.blocks : DEFAULT_LAYOUT.blocks;

      blocks.forEach((b) => {
        const el = map[b.id];
        if (!el) return;

        // 1) 顺序：按配置逐个 append，末尾即最后
        container.appendChild(el);

        // 2) 显隐：编辑画布里用淡化代替隐藏，方便重新打开
        const off = b.enabled === false;
        el.classList.toggle('designer-ghost', off && IS_DESIGNER);
        if (off) el.setAttribute('data-layout-hidden', 'true');
        else el.removeAttribute('data-layout-hidden');

        // 3) 间距（CSS 里原有的 margin-top 统一清零，避免叠加）
        el.style.marginTop = '0';
        el.style.marginBottom = (num(b.gap, 0) || 0) + 'px';

        // 4) 对齐（列数决定 flex 还是 grid，必须一起传进去）
        //    轮播区比较特殊：它内部永远撑满整行，所以这里强制 stretch，
        //    align 交由下面 6.5) 的专属分支处理（撑满 / 居中收窄）。
        applyBlockAlign(el, b.id, b.id === 'carousel' ? 'stretch' : b.align, b.columns);

        // 5) 自定义背景色
        //    ⚠️ 行内 padding 会盖掉样式表里的避让规则（header 的
        //    `padding-right: var(--float-safe)`），所以避让要在这里一起写进去：
        //    右内边距 = 背景留白 + 悬浮按钮安全区。
        //    （曾经只写 padding:20px，导致移动端页头右端紧贴卡片边缘，
        //      汉堡按钮被右上角悬浮按钮压住。）
        el.style.backgroundColor = b.bg || '';
        el.classList.toggle('has-bg', !!b.bg);
        if (b.bg) {
          el.style.padding = '20px';
          // 用 CSS 变量而非算死的像素，悬浮按钮关掉时避让会自动归零
          el.style.paddingRight = 'calc(20px + var(--float-safe, 0px))';
        } else {
          el.style.padding = '';
          el.style.paddingRight = '';
        }
        el.style.borderRadius = b.bg ? 'var(--radius)' : '';
        el.style.backgroundClip = '';

        // 6) 区块专属
        if (b.id === 'hero') {
          el.style.setProperty('--hero-title-size', num(b.titleSize, 34) + 'px');
        }
        if (b.id === 'feed') {
          el.setAttribute('data-columns', num(b.columns, 1) >= 2 ? '2' : '1');
        }
        // 6.5) 轮播区：高度可调（竖屏卡片，默认比旧版高一些）；「居中」= 收窄并居中
        if (b.id === 'carousel') {
          el.style.setProperty('--carousel-height', Math.max(140, num(b.height, 440)) + 'px');
          const narrow = b.align === 'center';
          el.style.maxWidth = narrow ? '720px' : '';
          el.style.marginLeft = narrow ? 'auto' : '';
          el.style.marginRight = narrow ? 'auto' : '';
          // 高度变了卡片尺寸也要重算（宽度没变时 layoutCarousel 会跳过，所以先把缓存清掉）
          carouselState.layoutW = 0;
          if (layoutCarousel()) applyCarouselLayout();
        }
      });

      // 区块顺序/间距变了 → 标签栏与内容区之间的相对位置也变了，锚点跟着重算
      syncFeedAnchor();
    }

    /* ---------------- 拉取文章 ----------------
       目录清单用 jsDelivr 的 data API（纯静态 JSON，比 GitHub Contents API
       少一次限流风险，也更快），失败再退回官方 API。
       文章正文同样走多源，并且并发抓取。
       -------------------------------------------- */
    /**
     * 列出内容目录下的所有 .md 文件。
     *
     * 两条路同时走，但**以 GitHub API 为准**：
     *   · jsDelivr 的 /flat 清单是静态索引，对新提交有明显延迟（几十分钟都可能），
     *     只认它会导致「刚发的文章迟迟不出现」——主人就踩过这个坑；
     *   · GitHub Contents API 是实时的，但有匿名限流（60 次/小时/IP）。
     * 所以：API 成功就用 API；API 挂了才退回 jsDelivr 清单。
     */
    async function listPostFiles(dir) {
      const clean = String(dir || 'content/notes').replace(/^\/+|\/+$/g, '');

      // 1) 本站代理 → GitHub Contents API（带 PAT 时 5000/h）
      const viaProxy = async () => {
        const res = await fetch(`/api/contents?path=${encodeURIComponent(clean)}&t=${Date.now()}`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const files = await res.json();
        if (!Array.isArray(files)) throw new Error('返回格式异常');
        return files
          .filter((f) => f && f.type === 'file' && /\.mdx?$/i.test(f.name))
          .map((f) => ({ name: f.name, path: f.path }));
      };

      const viaApi = async () => {
        const api = `https://api.github.com/repos/${SITE.user}/${SITE.repo}/contents/${clean}?ref=${SITE.branch}&t=${Date.now()}`;
        const res = await fetch(api, { headers: { Accept: 'application/vnd.github+json' } });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const files = await res.json();
        if (!Array.isArray(files)) throw new Error('返回格式异常');
        return files
          .filter((f) => f && f.type === 'file' && /\.mdx?$/i.test(f.name))
          .map((f) => ({ name: f.name, path: f.path }));
      };

      const viaJsdelivr = async () => {
        const res = await fetch(`https://data.jsdelivr.com/v1/package/gh/${GH_SLUG}/flat`, { cache: 'default' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const files = (data && Array.isArray(data.files)) ? data.files : [];
        return files
          .filter((f) => f && typeof f.name === 'string')
          .filter((f) => f.name.indexOf('/' + clean + '/') === 0 && /\.mdx?$/i.test(f.name))
          .map((f) => ({ name: f.name.split('/').pop(), path: f.name.replace(/^\//, '') }));
      };

      // 0) bundle 内存：一次请求已经把「content/ 下所有文件」带回来了，
      //    直接从它的 key 里筛出本目录的 .md —— 零额外请求。
      //    实时性由 /api/bundle 的 s-maxage=5 保证：新发的文章最多 5 秒后出现。
      const viaBundle = async () => {
        await Promise.race([loadBundle(), new Promise((r) => setTimeout(() => r(null), 2500))]);
        const hits = bundleList(clean);
        if (!hits) throw new Error('bundle 里没有这个目录');
        return hits;
      };

      // 优先级：bundle → 代理 → GitHub API（实时但可能限流）→ jsDelivr 清单（滞后但稳定）
      for (const fn of [viaBundle, viaProxy, viaApi, viaJsdelivr]) {
        try {
          const hits = await fn();
          if (hits.length) return hits;
        } catch (e) { /* 落到下一路 */ }
      }

      throw new Error('内容目录读取失败，可能是内容源暂时不可达');
    }

    async function fetchPosts(dir) {
      const mdFiles = await listPostFiles(dir);

      // 并发抓取：文章之间互不依赖，串行等只会把延迟叠加起来。
      // 单篇失败不影响其余（allSettled 而不是 all）。
      const settled = await Promise.allSettled(mdFiles.map(async (file) => {
        const { text } = await fetchTextMulti(file.path);
        const { data, body } = parseFrontmatter(text);
        if (data.draft === true || data.draft === 'true') return null;   // 草稿不上前台

        return repairDeep({
          title: data.title || file.name.replace(/\.mdx?$/i, ''),
          date: data.date || '',
          cover: data.thumbnail || data.cover || data.image || '',
          description: data.description || data.summary || '',
          tags: Array.isArray(data.tags) ? data.tags : (data.tags ? [data.tags] : []),
          featured: data.featured === true || data.featured === 'true',
          // 「只发画廊」：勾了就不进首页的「全部」流（但点具体标签时能看到）
          galleryOnly: data.gallery_only === true || data.gallery_only === 'true',
          // 「加入首页轮播图」：勾了它的图才会进首页轮播区
          carousel: data.carousel === true || data.carousel === 'true',
          body: body.trim(),
          filename: file.name
        });
      }));

      const posts = [];
      settled.forEach((r, i) => {
        if (r.status === 'fulfilled') {
          if (r.value) posts.push(r.value);
        } else {
          console.warn('跳过无法解析的文件：' + mdFiles[i].path, r.reason);
        }
      });

      // 一篇都没拿到，说明源全挂了；抛出去让上层决定（缓存兜底 or 报错）
      if (mdFiles.length && posts.length === 0) {
        throw new Error('文章内容读取失败，可能是内容源暂时不可达');
      }

      // 置顶优先，其次按日期倒序
      posts.sort((a, b) => {
        if (a.featured !== b.featured) return a.featured ? -1 : 1;
        return new Date(b.date || 0) - new Date(a.date || 0);
      });
      return posts;
    }

    // 缓存里的文章不含函数，直接可用；但封面仍需补一遍逻辑
    function normalizeCachedPosts(posts) {
      if (!Array.isArray(posts)) return null;
      return posts.filter((p) => p && typeof p === 'object').map((p) => Object.assign({
        title: '', date: '', cover: '', description: '',
        tags: [], featured: false, galleryOnly: false, carousel: false, body: '', filename: ''
      }, p));
    }

    function renderPosts(posts, settings, activeTag) {
      // 记下渲染输入，供「库晚到后重渲染」复用
      lastPosts = posts;
      lastSettings = settings;
      lastActiveTag = activeTag || '全部';

      const feed = $('feed');
      const showTags = settings.show_tags !== false;

      const isAll = !activeTag || activeTag === '全部';

      /*
       * 「只发画廊」的内容（后台勾了「只发画廊」开关）不进首页的「全部」流 ——
       * 主人要首页以文字为主，随手发的插画不占位置。
       *
       * 但**主动点某个标签时要能看到**：那一刻的意思是「我想看这个标签的全部」，
       * 再藏起来就反直觉了（点 #插画 却看不到插画最奇怪）。
       *
       * ⚠️ 标签栏（renderTagBar）必须拿**全量 posts** 生成。否则当插画全是
       *    「只发画廊」时，「#插画」这颗按钮压根不会出现 —— 就成了死路：
       *    想看却没入口。
       */
      const pool = isAll ? posts.filter((p) => !p.galleryOnly) : posts;
      const list = isAll ? pool : pool.filter((p) => p.tags.indexOf(activeTag) !== -1);

      if (list.length === 0) {
        const onlyGallery = isAll && posts.length > 0;
        feed.innerHTML = `<div class="status-box"><p>${posts.length === 0
          ? '暂无已发布内容'
          : onlyGallery
            ? '首页这里暂时没有内容。还有内容只发在「画廊」页 —— 点上面的标签就能看到。'
            : '该标签下暂无内容'}</p></div>`;
        return;
      }

      feed.innerHTML = '';
      list.forEach((post) => {
        const card = document.createElement('article');
        card.className = 'post-card';
        // 可点开放大：加 tabindex 让它也能用键盘操作
        card.tabIndex = 0;
        card.setAttribute('role', 'button');
        card.setAttribute('aria-label', `${post.title} — 点击放大查看`);

        const tagsHtml = showTags && post.tags.length
          ? post.tags.map((t) => `<span class="post-tag">#${escapeHtml(t)}</span>`).join('')
          : '';

        card.innerHTML = `
          ${post.featured ? '<span class="pin">置顶</span>' : ''}
          <h2 class="post-title">${escapeHtml(post.title)}</h2>
          <div class="post-meta">
            ${post.date ? `<span>${escapeHtml(formatDate(post.date))}</span>` : ''}
            ${tagsHtml}
          </div>
          ${post.cover ? `<div class="post-cover-wrapper" title="点击看大图"><img class="post-cover" loading="lazy" src="${escapeHtml(post.cover)}" alt="${escapeHtml(post.title)}"></div>` : ''}
          ${post.description ? `<p class="post-desc">${escapeHtml(post.description)}</p>` : ''}
          <div class="post-body">${md2html(post.body)}</div>
        `;
        // 封面和正文里的图片统一挂容错：缩图失败 → 原图直连 → 代理 → 仍失败就摘掉
        applyThumbImages(card, IMG_THUMB_WIDTH);   // 封面 + 正文图片都转 webp 缩图
        guardImages(card);
        feed.appendChild(card);
      });
    }

    /* 键盘也能打开/收回放大（回车或空格） */
    function setupZoomKeyboard() {
      $('feed').addEventListener('keydown', (e) => {
        if (IS_DESIGNER) return;
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const card = e.target.closest('.post-card');
        if (!card || e.target.closest('a')) return;
        e.preventDefault();
        if (zoomState && zoomState.card === card) closeZoom();
        else openZoom(card);
      });
    }

    function renderTagBar(posts, settings, activeTag, onChange) {
      const toolbar = $('toolbar');
      const tags = [];
      posts.forEach((p) => p.tags.forEach((t) => { if (tags.indexOf(t) === -1) tags.push(t); }));

      // 标签栏的高度决定了「点导航里的内容要留多少」——渲染前后都要同步一次
      if (settings.show_tags === false || tags.length === 0) {
        toolbar.hidden = true;
        syncFeedAnchor();
        return;
      }

      toolbar.hidden = false;
      toolbar.innerHTML = '';
      ['全部'].concat(tags).forEach((tag) => {
        const btn = document.createElement('button');
        btn.className = 'chip' + (tag === activeTag ? ' active' : '');
        btn.textContent = tag === '全部' ? '全部' : '#' + tag;
        btn.onclick = () => onChange(tag);
        toolbar.appendChild(btn);
      });

      syncFeedAnchor();
    }

    /* ---------------- 导航「内容」的锚点 ----------------
       导航里的「内容」指向 /#feed，而标签筛选栏（#toolbar）正好贴在内容区上方：
       直接跳过去，标签栏会被滚出视野顶端 —— 看起来就是「点了内容却没有标签可选」。
       这里实测标签栏高度（窄屏会换行、标签数量也会变，不是常数）写成 --feed-anchor，
       由 #feed 的 scroll-margin-top 使用，跳转后标签栏刚好留在视野顶端。 */
    function syncFeedAnchor() {
      const tb = $('toolbar');
      const feed = $('feed');
      if (!tb || !feed) return 0;
      let anchor = 0;
      if (!tb.hidden && tb.offsetHeight > 0) {
        const tr = tb.getBoundingClientRect();
        const fr = feed.getBoundingClientRect();
        // 只在标签栏确实位于内容区上方时才避让：主人可以在可视化布局里换顺序，
        // 换过之后这里自动归零（不会凭空多出一段空白）。
        if (tr.bottom <= fr.top + 4) {
          anchor = Math.round(tr.height + Math.max(0, fr.top - tr.bottom) + 10);
        }
      }
      document.documentElement.style.setProperty('--feed-anchor', anchor + 'px');
      return anchor;
    }

    /** 带 #feed 进站（从别的页面点「内容」）时，内容异步到达后锚点位置还会变，重新对齐一次 */
    function scrollToFeedIfHashed() {
      if (location.hash !== '#feed') return;
      const feed = $('feed');
      if (!feed) return;
      syncFeedAnchor();
      feed.scrollIntoView({ block: 'start' });
    }

    /** 视口宽度变了 → 标签可能重新换行 → 标签栏高度变 → 锚点要重算 */
    function setupFeedAnchor() {
      window.addEventListener('resize', syncFeedAnchor);
      window.addEventListener('load', () => { syncFeedAnchor(); scrollToFeedIfHashed(); });
      window.addEventListener('hashchange', () => {
        if (location.hash === '#feed') scrollToFeedIfHashed();
      });
    }

    /* ==========================================================
       首页轮播图
       ----------------------------------------------------------
       内容来源：后台给笔记勾上「加入首页轮播图」（notes 的 carousel 字段）。
       每篇取它的封面（thumbnail）+ 正文里插的图，顺序沿用笔记原有顺序
       （置顶优先、其次日期倒序）。
       区域本身是 layout.json 里的一个区块（id: carousel），
       位置/显隐/间距/对齐/高度都归可视化编辑器管；
       标题、按钮文字、播放速度在后台「首页轮播图」里改。
       ========================================================== */
    const CAROUSEL_HARD_MAX = 20;         // 兜底上限，防止配置写出天文数字
    const CAROUSEL_MIN_INTERVAL = 1.5;    // 自动播放最小间隔（秒），再快会晕

    /* 卡牌堆叠的参数 */
    const CAROUSEL_VISIBLE = 5;                       // 同时可见 5 张
    const CAROUSEL_HALF = Math.floor(CAROUSEL_VISIBLE / 2);   // 左右各 2 张（=可见的边界）
    const CAROUSEL_CARD_RATIO = 0.75;                 // 竖屏卡片：宽 = 高 × 0.75（即 3:4）
    const CAROUSEL_STEP_RATIO = 0.62;                 // 相邻两张的间距 = 卡宽 × 0.62（余下 38% 互相叠着）
    // 按「离当前这张有多远」取值：越远越小、越暗（第 3 张之外整张隐掉）
    const CAROUSEL_SCALE = [1, 0.88, 0.78, 0.7];
    /* ⚠️ 「远处的卡更暗」用的是**卡内深色薄纱**（--veil），不是整卡 opacity ——
       整卡半透明的中间态会透出后面那张卡、连它模糊底图的矩形边一起露出来（主人反馈过）。
       卡片本身永远不透明，只盖一层纱；到 ±2 就封顶，更远的整张隐掉（visibility）。 */
    const CAROUSEL_VEIL = [0, 0.30, 0.56];
    const CAROUSEL_ROT_DEG = 7;                       // 两侧卡片的倾斜角（度/每档）

    const carouselState = {
      slides: [],
      index: 0,
      timer: null,
      preloadTimer: null,
      paused: false,
      signature: '',    // 内容指纹：没变就不重建 DOM，免得把看到一半的轮播打回第一张
      bound: false,
      cfg: null,
      step: 0,          // 相邻卡片的横向间距（layoutCarousel 算出来）
      layoutW: 0        // 上次算尺寸时的可用宽度，宽度没变就不重算
    };

    function reducedMotion() {
      try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
      catch (e) { return false; }
    }

    /**
     * 从一篇笔记里收集图片地址：封面优先，然后是正文里的 Markdown 图片。
     * 去重，并丢掉 javascript:/data: 这类可疑协议。
     */
    function collectPostImages(post) {
      const out = [];
      const push = (u) => {
        const s = String(u == null ? '' : u).trim();
        if (!s) return;
        if (/^(javascript|data|vbscript):/i.test(s)) return;
        if (out.indexOf(s) !== -1) return;
        out.push(s);
      };
      push(post.cover);
      // ![说明](地址) 或 ![说明](<地址>)
      const re = /!\[[^\]]*\]\(\s*(<[^>\s]+>|[^)\s]+)/g;
      const body = String(post.body || '');
      let m;
      while ((m = re.exec(body))) push(String(m[1]).replace(/^<|>$/g, ''));
      return out;
    }

    /**
     * 主人习惯直接拿日期当作品名（「26.9.1」这种），此时再显示一遍日期就成了
     * 「26.9.1 2026年9月1日」两个日期并排。
     * 所以：标题能解析成日期、且和笔记日期是同一天 → 标题是多余的，只留日期；
     * 标题是真名字（如「桃金娘」）→ 标题和日期都要。
     */
    function titleIsJustTheDate(title, date) {
      const t = String(title == null ? '' : title).trim();
      if (!t || !date) return false;
      const m = t.match(/^(\d{2}|\d{4})\s*[.\-/年]\s*(\d{1,2})\s*[.\-/月]\s*(\d{1,2})\s*日?$/);
      if (!m) return false;
      const y = m[1].length === 2 ? 2000 + Number(m[1]) : Number(m[1]);
      const mo = Number(m[2]);
      const da = Number(m[3]);
      const d = new Date(date);
      if (isNaN(d.getTime())) return false;
      return y === d.getFullYear() && mo === d.getMonth() + 1 && da === d.getDate();
    }

    /** 把笔记列表摊平成「张」列表 */
    function buildCarouselSlides(posts, cfg) {
      const limit = Math.max(1, Math.min(CAROUSEL_HARD_MAX, num(cfg && cfg.slide_limit, 8) || 8));
      const slides = [];
      (posts || []).forEach((p) => {
        if (!p || !p.carousel) return;
        collectPostImages(p).forEach((src) => {
          slides.push({ src: src, title: p.title || '', date: p.date || '' });
        });
      });
      return slides.slice(0, limit);
    }

    function showCarouselSlide(i, userAction) {
      const n = carouselState.slides.length;
      if (!n) return;
      carouselState.index = ((i % n) + n) % n;
      applyCarouselLayout();

      const dots = $('carouselDots');
      if (dots) {
        Array.prototype.forEach.call(dots.children, (d, k) => {
          const on = k === carouselState.index;
          d.classList.toggle('active', on);
          d.setAttribute('aria-selected', on ? 'true' : 'false');
        });
      }
      // 手动翻页后重新计时，免得刚点完就被自动播放抢走
      if (userAction && !carouselState.paused) startCarouselAutoplay();
    }

    /**
     * 第 k 张卡离「当前这张」有多远（0 = 正中间，±1 = 左右各一张，可以越过一圈）。
     * 为什么要绕圈算：首尾要相接 —— 第 1 张的左边那张就是最后一张，
     * 这样任何时刻「可见的 5 张」永远填得满，两侧不会出现空位。
     */
    function carouselOffset(k) {
      const n = carouselState.slides.length;
      if (!n) return 0;
      let d = (((k - carouselState.index) % n) + n) % n;      // 0 .. n-1
      if (d > Math.floor(n / 2)) d -= n;                      // 折到负半边
      return d;
    }

    /**
     * 按可用宽度算一次卡片尺寸与间距（宽度没变就不重算）。
     * · 竖屏卡片：宽 = 高 × 0.75（3:4），「轮播图高度」滑杆是**上限**；
     * · 相邻间距：取「卡宽的 62%」与「刚好塞得下 5 张」的较小值 ——
     *   窄屏上后者生效，于是 5 张挤成一叠、每张只露出一条边（卡牌堆叠的观感）。
     */
    function layoutCarousel() {
      const viewport = $('carouselViewport');
      const section = $('carousel');
      if (!viewport || !section || viewport.hidden) return false;
      const w = viewport.clientWidth;
      if (!w) return false;
      if (w === carouselState.layoutW) return false;   // 宽度没变：别白算，也避免 ResizeObserver 打转
      carouselState.layoutW = w;

      const maxH = parseFloat(getComputedStyle(section).getPropertyValue('--carousel-height')) || 320;
      const cardW = Math.max(96, Math.min(w * 0.62, maxH * CAROUSEL_CARD_RATIO));
      const cardH = Math.round(cardW / CAROUSEL_CARD_RATIO);
      const stepMax = (w - cardW) / (2 * CAROUSEL_HALF + 0.2);   // 让最外边那张刚好留在视口内
      carouselState.step = Math.round(Math.min(cardW * CAROUSEL_STEP_RATIO, Math.max(0, stepMax)));
      viewport.style.setProperty('--carousel-card-w', Math.round(cardW) + 'px');
      viewport.style.setProperty('--carousel-card-h', cardH + 'px');
      return true;
    }

    /** 按距离摆好每一张卡：位移 / 倾斜 / 缩放 / 薄纱 / 显隐 / 层级 */
    function applyCarouselLayout() {
      const track = $('carouselTrack');
      if (!track) return;
      const step = carouselState.step;
      Array.prototype.forEach.call(track.children, (fig, k) => {
        const d = carouselOffset(k);
        const ad = Math.abs(d);
        const far = ad > CAROUSEL_HALF;                  // 第 3 张之外：整张隐掉、不可点、Tab 不到
        const lv = Math.min(ad, CAROUSEL_SCALE.length - 1);
        /* ⚠️ 薄纱档位在 ±2 就封顶（不再随距离加深）：
           反正 ±3 之外整张都是隐的，让它的纱保持不变，
           切换时进入可见区的那张就不会同时还在变暗/变亮（少一个动的维度）。 */
        const vl = Math.min(ad, CAROUSEL_VEIL.length - 1);
        fig.style.setProperty('--dx', Math.round(d * step) + 'px');
        fig.style.setProperty('--rot', (far ? 0 : -d * CAROUSEL_ROT_DEG) + 'deg');
        fig.style.setProperty('--s', CAROUSEL_SCALE[lv]);
        fig.style.setProperty('--veil', CAROUSEL_VEIL[vl]);
        fig.style.zIndex = String(100 - ad);             // 中间的压在最上面
        fig.classList.toggle('is-current', ad === 0);
        fig.classList.toggle('is-far', far);             // 显隐：CSS 里是 visibility，不是 opacity
        fig.tabIndex = far ? -1 : 0;
        fig.setAttribute('aria-hidden', far ? 'true' : 'false');
      });
    }

    function stopCarouselAutoplay() {
      if (carouselState.timer) {
        clearInterval(carouselState.timer);
        carouselState.timer = null;
      }
    }

    function startCarouselAutoplay() {
      stopCarouselAutoplay();
      const cfg = carouselState.cfg || DEFAULT_CAROUSEL;
      if (cfg.autoplay === false) return;
      if (carouselState.slides.length < 2) return;   // 只有一张就不用播
      if (reducedMotion()) return;                   // 系统设了「减少动态效果」就尊重它
      const sec = Math.max(CAROUSEL_MIN_INTERVAL, num(cfg.interval, 5) || 5);
      carouselState.timer = setInterval(() => {
        if (carouselState.paused) return;
        if (document.hidden) return;                 // 切到别的标签页时先停
        showCarouselSlide(carouselState.index + 1);
      }, sec * 1000);
    }

    /**
     * 轮播图的显示地址：走图片代理现场缩放成 webp。
     * 主人的原图是 1600px 左右的 PNG（每张几百 KB），8 张一起在首屏加载太重；
     * 这里压到 1280px webp（约 1/5 大小），放大看大图时再用原图。
     */
    const CAROUSEL_THUMB_W = 1280;
    function carouselThumbUrl(url) {
      return thumbImageUrl(url, CAROUSEL_THUMB_W, 82);
    }

    /**
     * 轮播图的图片容错：直连失败 → 走图片代理重试 → 仍失败就留一句说明。
     * ⚠️ 这里刻意**不**把整格抽掉（卡片封面那套会 remove），
     *    否则删掉一格会让后面所有格的 translateX 错位。
     */
    function guardCarouselImage(img) {
      if (!img || img.dataset.imgGuard === '1') return;
      img.dataset.imgGuard = '1';
      img.setAttribute('referrerpolicy', 'no-referrer');
      img.setAttribute('decoding', 'async');

      // 真正的原图地址（src 现在是缩图，兜底重试要用原图）
      const original = img.dataset.full || img.getAttribute('src') || '';
      let viaProxy = false;
      img.addEventListener('error', () => {
        if (!viaProxy && proxiableImage(original)) {
          viaProxy = true;
          img.setAttribute('data-via-proxy', '1');
          img.src = proxiedImageUrl(original);
          return;
        }
        const fig = img.closest('.carousel-slide');
        img.remove();
        if (fig && !fig.querySelector('.carousel-fallback')) {
          const box = document.createElement('div');
          box.className = 'carousel-fallback';
          box.textContent = '这张图暂时打不开';
          fig.appendChild(box);
        }
      });
    }

    function buildCarouselDom(slides, c) {
      const track = $('carouselTrack');
      track.innerHTML = '';

      slides.forEach((s, k) => {
        const fig = document.createElement('figure');
        fig.className = 'carousel-slide';
        fig.tabIndex = 0;
        fig.setAttribute('role', 'button');
        fig.setAttribute('aria-label', (s.title ? s.title + ' — ' : '') + '点击看大图');
        fig.dataset.index = String(k);

        const img = document.createElement('img');
        img.className = 'carousel-img';
        // ⚠️ 堆叠布局下「首屏看得到」的不止开头几张：当前张在正中时，
        //    最后 2 张会从左侧露出来（首尾相接）。所以要一起 eager，
        //    否则刚进页面左边那两张是空的。
        const firstView = k < Math.ceil(CAROUSEL_VISIBLE / 2) || k >= slides.length - CAROUSEL_HALF;
        img.loading = firstView ? 'eager' : 'lazy';
        if (k === 0) img.setAttribute('fetchpriority', 'high');
        img.alt = s.title || '';
        img.dataset.full = s.src;                  // 看大图用原图
        const thumb = carouselThumbUrl(s.src);     // 显示用缩放后的 webp
        img.src = thumb;
        // 同一张图交给 ::before 当模糊底（CSS 里 background-image: inherit）
        fig.style.backgroundImage = 'url("' + String(thumb).replace(/["\\\r\n]/g, '') + '")';
        fig.appendChild(img);

        if (c.show_caption !== false && (s.title || s.date)) {
          const cap = document.createElement('figcaption');
          cap.className = 'carousel-cap';
          // 标题本身就是这条笔记的日期时，只显示日期那一种写法，别并排出现两个日期
          if (s.title && !titleIsJustTheDate(s.title, s.date)) {
            const t = document.createElement('span');
            t.textContent = s.title;
            cap.appendChild(t);
          }
          if (s.date) {
            const d = document.createElement('span');
            d.className = 'carousel-cap-time';
            d.textContent = formatDate(s.date);
            cap.appendChild(d);
          }
          fig.appendChild(cap);
        }
        track.appendChild(fig);
      });
      guardImages(track, guardCarouselImage);

      // 首屏先不跟图片抢带宽；等页面闲下来再把剩下的图预热好，
      // 这样往两边翻时不会先白一下。
      clearTimeout(carouselState.preloadTimer);
      carouselState.preloadTimer = setTimeout(function preloadRest() {
        if (!carouselState.slides.length) return;
        const lazy = track.querySelectorAll('img[loading="lazy"]');
        Array.prototype.forEach.call(lazy, (im) => { im.loading = 'eager'; });
      }, 1500);

      const dots = $('carouselDots');
      dots.innerHTML = '';
      slides.forEach((s, k) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'carousel-dot';
        b.setAttribute('role', 'tab');
        b.setAttribute('aria-label', '第 ' + (k + 1) + ' 张');
        b.addEventListener('click', () => showCarouselSlide(k, true));
        dots.appendChild(b);
      });
    }

    function renderCarousel(posts, cfg) {
      const section = $('carousel');
      if (!section) return;

      const c = Object.assign({}, DEFAULT_CAROUSEL, cfg || {});
      carouselState.cfg = c;

      const title = String(c.title == null ? '' : c.title).trim();
      const subtitle = String(c.subtitle == null ? '' : c.subtitle).trim();
      const buttonText = String(c.button_text == null ? '' : c.button_text).trim();
      const buttonUrl = String(c.button_url == null ? '' : c.button_url).trim() || '/gallery/';

      const tEl = $('carouselTitle');
      tEl.textContent = title;
      tEl.hidden = !title;
      const sEl = $('carouselSubtitle');
      sEl.textContent = subtitle;
      sEl.hidden = !subtitle;
      const mEl = $('carouselMore');
      mEl.textContent = buttonText;
      mEl.href = buttonUrl;
      if (/^https?:\/\//i.test(buttonUrl)) {
        mEl.target = '_blank';
        mEl.rel = 'noopener noreferrer';
      } else {
        mEl.removeAttribute('target');
        mEl.removeAttribute('rel');
      }
      mEl.hidden = !buttonText;

      const slides = buildCarouselSlides(posts, c);
      carouselState.slides = slides;

      if (!slides.length) {
        stopCarouselAutoplay();
        $('carouselViewport').hidden = true;
        $('carouselDots').hidden = true;
        const empty = $('carouselEmpty');
        if (IS_DESIGNER) {
          // 画布里必须留一块看得见、点得到的位置，否则主人根本没法拖它
          empty.hidden = false;
          empty.innerHTML = '轮播图会显示你勾选了「加入首页轮播图」的笔记里的图片。<br>' +
                            '现在还没有 —— 去后台给带图的笔记勾上，它就会出现。';
          section.hidden = false;
        } else {
          empty.hidden = true;
          section.hidden = true;
        }
        carouselState.signature = '';
        return;
      }

      section.hidden = false;
      $('carouselEmpty').hidden = true;
      $('carouselViewport').hidden = false;

      const signature = JSON.stringify(slides) + '|' + title + '|' + subtitle + '|' +
                        buttonText + '|' + buttonUrl + '|' + (c.show_caption !== false);
      if (signature !== carouselState.signature) {
        buildCarouselDom(slides, c);
        carouselState.signature = signature;
        if (carouselState.index > slides.length - 1) carouselState.index = 0;
      }

      const single = slides.length < 2;
      $('carouselDots').hidden = single;
      $('carouselPrev').hidden = single;
      $('carouselNext').hidden = single;

      // 卡片尺寸依赖可用宽度与高度上限，先把尺寸算好再摆位
      carouselState.layoutW = 0;
      layoutCarousel();
      showCarouselSlide(carouselState.index);
      startCarouselAutoplay();
    }

    /** 一次性挂好交互：箭头、看大图、键盘、悬停暂停、触屏滑动 */
    function setupCarousel() {
      if (carouselState.bound) return;
      const section = $('carousel');
      const viewport = $('carouselViewport');
      if (!section || !viewport) return;
      carouselState.bound = true;

      $('carouselPrev').addEventListener('click', (e) => {
        e.preventDefault();
        showCarouselSlide(carouselState.index - 1, true);
      });
      $('carouselNext').addEventListener('click', (e) => {
        e.preventDefault();
        showCarouselSlide(carouselState.index + 1, true);
      });

      // 点卡片：点旁边那几张 = 把它转到中间；点中间那张 = 看大图
      // （编辑器画布里都不启用，免得干扰拖拽与选中）
      viewport.addEventListener('click', (e) => {
        if (IS_DESIGNER) return;
        const fig = e.target.closest('.carousel-slide');
        if (!fig) return;
        const k = num(fig.dataset.index, -1);
        if (k < 0) return;
        e.stopPropagation();
        if (k !== carouselState.index) {
          showCarouselSlide(k, true);
          return;
        }
        const img = fig.querySelector('img');
        if (!img) return;
        // 优先用原图（src 是压过的缩图，放大看会糊）
        const full = img.dataset.full || img.getAttribute('src');
        if (!full) return;
        openLightbox(full, img.getAttribute('alt') || '');
      });

      section.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          showCarouselSlide(carouselState.index - 1, true);
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          showCarouselSlide(carouselState.index + 1, true);
        }
      });

      // 鼠标移上去 / 键盘聚焦时暂停，走开再继续
      section.addEventListener('mouseenter', () => { carouselState.paused = true; });
      section.addEventListener('mouseleave', () => { carouselState.paused = false; });
      section.addEventListener('focusin', () => { carouselState.paused = true; });
      section.addEventListener('focusout', (e) => {
        if (!section.contains(e.relatedTarget)) carouselState.paused = false;
      });

      // 触屏左右滑
      let startX = 0, startY = 0, tracking = false;
      viewport.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        tracking = true;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true });
      viewport.addEventListener('touchend', (e) => {
        if (!tracking) return;
        tracking = false;
        const t = e.changedTouches[0];
        if (!t) return;
        const dx = t.clientX - startX;
        const dy = t.clientY - startY;
        // 横向位移要明显大于纵向，免得和页面上下滚动打架
        if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          showCarouselSlide(carouselState.index + (dx < 0 ? 1 : -1), true);
        }
      }, { passive: true });

      // 可用宽度变了要重算卡片尺寸（横竖屏切换、窗口缩放、设计器里拉宽画布…）
      const relayout = () => {
        carouselState.layoutW = 0;
        if (layoutCarousel()) applyCarouselLayout();
      };
      if (typeof ResizeObserver === 'function') {
        // 只在宽度变化时才算（layoutCarousel 里用 layoutW 挡掉了高度变化引起的回调），
        // 否则「改高度 → 触发回调 → 又改高度」会自己打转。
        new ResizeObserver(relayout).observe(viewport);
      } else {
        window.addEventListener('resize', relayout);
      }

      // 切回本标签页时重新对齐计时（后台标签里定时器会被浏览器节流）
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && carouselState.slides.length > 1) startCarouselAutoplay();
      });
    }

    /* ==========================================================
       可视化编辑器桥接（同源 iframe 通信）
       ========================================================== */
    const postToParent = (msg) => {
      if (window.parent !== window) window.parent.postMessage(msg, location.origin);
    };

    window.addEventListener('message', (ev) => {
      if (ev.origin !== location.origin) return;
      const msg = ev.data;
      if (!msg || typeof msg !== 'object' || !IS_DESIGNER) return;

      if (msg.type === 'designer:apply' && msg.layout) {
        // 编辑器里改的是 layout.json，实时预览必须「所见即所改」——
        // 所以这里刻意不传 settings：否则编辑器把某个颜色清空后，
        // 会被 settings.json 里的旧值顶回来，主人会以为「清除按钮坏了」。
        applyTokens(msg.layout.tokens);
        applyLayout(msg.layout);
        postToParent({ type: 'designer:applied' });
      }

      if (msg.type === 'designer:select') {
        document.querySelectorAll('.block.is-selected').forEach((el) => el.classList.remove('is-selected'));
        if (msg.id) {
          const el = document.querySelector(`[data-block="${msg.id}"]`);
          if (el) el.classList.add('is-selected');
        }
      }
    });

    if (IS_DESIGNER) {
      /* 点击画布 → 通知编辑器选中它。
         除了区块 id，还上报「点到的是区块里哪个具体元素」（part），
         这样编辑器能把右栏滚到对应的那个设置项并高亮。
         约定：part 是语义化的 key，与编辑器侧的 PART_HINTS 对应；
         拿不到具体元素时留空，编辑器就只做区块级定位。 */
      document.addEventListener('click', (e) => {
        const block = e.target.closest('[data-block]');
        if (!block) return;
        e.preventDefault();
        e.stopPropagation();
        postToParent({
          type: 'designer:clicked',
          id: block.dataset.block,
          part: identifyPart(e.target, block)
        });
      }, true);
    }

    /**
     * 判断画布上被点中的元素属于哪个「可调项」。
     * 只认那些确实有对应设置项的元素 —— 认不出来就返回空，
     * 不要瞎猜，否则编辑器会跳到一个跟用户预期无关的位置。
     */
    function identifyPart(target, block) {
      if (!target || !target.closest) return '';
      // 从被点元素向上找第一个带 id 的祖先（区块内的文字元素都挂了 id）
      const hit = (sel) => !!target.closest(sel);

      if (block.dataset.block === 'hero') {
        if (hit('#heroBadge')) return 'heroBadge';
        if (hit('#heroTitle')) return 'heroTitle';
        if (hit('#heroSubtitle')) return 'heroSubtitle';
      }
      if (block.dataset.block === 'header') {
        if (hit('#siteTitle')) return 'siteTitle';
        if (hit('#siteSubtitle')) return 'siteSubtitle';
        if (hit('.nav') || hit('#navLinks') || hit('#navToggle')) return 'nav';
      }
      if (block.dataset.block === 'about') {
        if (hit('#aboutTitle')) return 'aboutTitle';
        if (hit('#aboutBody')) return 'aboutBody';
      }
      if (block.dataset.block === 'announce') return 'announce';
      if (block.dataset.block === 'toolbar') return 'toolbar';
      if (block.dataset.block === 'carousel') {
        if (hit('#carouselMore')) return 'carouselMore';
        if (hit('#carouselTitle') || hit('#carouselSubtitle')) return 'carouselTitle';
        return 'carousel';
      }
      if (block.dataset.block === 'feed') {
        if (hit('.post-title')) return 'postTitle';
        if (hit('.post-excerpt') || hit('.post-summary')) return 'postExcerpt';
        if (hit('.post-meta') || hit('.post-date')) return 'postMeta';
        if (hit('.post-tag') || hit('.chip')) return 'postTag';
        return 'feed';
      }
      if (block.dataset.block === 'footer') return 'footer';
      return '';
    }

    /* ---------------- 启动 ----------------
       分两阶段，理由是「第一次加载的体感」：
         A. 同步阶段：立刻用内置默认值把标题/简介/关于我/页脚画出来，
            页面永远不会是第一眼白屏 —— 这部分不依赖任何网络请求。
         B. 异步阶段：先吃本地缓存（有就秒换），再并发拉远端，
            拿到后静默替换。访客不会盯着空页面等。
       ------------------------------------------- */
    (async function init() {
      const feed = $('feed');

      /*
       * 稍等一下 marked / DOMPurify。
       *
       * 为什么值得等：它们是异步回退加载的，若渲染时还没到位，
       * 正文会先以「纯文本 + 无 markdown」上屏，等库回来再重画一次
       * ——用户看到的就是一次可见的闪动（链接和颜色先消失再出现）。
       *
       * 等地很克制：最多 1.2 秒，且只要两库都齐就立刻继续。
       * 真等不到也不卡住（后面 renderPlainWithColors 兜底，颜色仍生效）。
       */
      await (function waitLibs() {
        return new Promise((resolve) => {
          if (window.marked && window.DOMPurify) return resolve();
          const t0 = Date.now();
          const tick = setInterval(() => {
            if ((window.marked && window.DOMPurify) || Date.now() - t0 > 1200) {
              clearInterval(tick);
              resolve();
            }
          }, 60);
        });
      })();

      // ---- A. 先用内置默认值上屏（0 请求，立即有内容可看）----
      applySettings(DEFAULT_SETTINGS);
      applyHomepage(DEFAULT_HOMEPAGE, DEFAULT_SETTINGS);
      applyLayout(mergeLayout(DEFAULT_LAYOUT));
      applyTokens(DEFAULT_LAYOUT.tokens, DEFAULT_SETTINGS);
      setupNavToggle();
      setupZoom();
      setupZoomKeyboard();
      setupCarousel();              // 轮播区的事件只挂一次（重建内容时不重复绑定）
      setupFeedAnchor();            // 导航「内容」的锚点（让标签栏留在视野里）
      renderCarousel(null, DEFAULT_CAROUSEL);

      // ---- B1. 本地缓存：老访客走这条，几乎瞬开 ----
      const cache = readCache();
      let showedCache = false;
      if (cache && cache.settings) {
        const cs = Object.assign({}, DEFAULT_SETTINGS, cache.settings);
        const ch = Object.assign({}, DEFAULT_HOMEPAGE, cache.homepage || {});
        const cl = mergeLayout(cache.layout);
        const ccfg = Object.assign({}, DEFAULT_CAROUSEL, cache.carousel || {});
        applySettings(cs);
        applyHomepage(ch, cs);
        applyLayout(cl);
        applyTokens(cl.tokens, cs);

        const cachedPosts = normalizeCachedPosts(cache.posts);
        renderCarousel(cachedPosts, ccfg);      // 老访客：轮播也用缓存先顶上
        if (cachedPosts && cachedPosts.length) {
          let activeTag = '全部';
          const renderCached = () => {
            renderPosts(cachedPosts, cs, activeTag);
            feed.classList.add('from-cache');
            renderTagBar(cachedPosts, cs, activeTag, (tag) => { activeTag = tag; renderCached(); });
          };
          renderCached();
          showedCache = true;
        }
      }

      // ---- B2. 拉远端最新，拿到后替换 ----
      let settings = DEFAULT_SETTINGS, homepage = DEFAULT_HOMEPAGE, layout = DEFAULT_LAYOUT,
          posts = null, carouselCfg = DEFAULT_CAROUSEL;
      try {
        const [s, h, l, cr] = await Promise.all([
          fetchJSON(SITE.settingsFile, DEFAULT_SETTINGS),
          fetchJSON(SITE.homepageFile, DEFAULT_HOMEPAGE),
          fetchJSON(SITE.layoutFile, DEFAULT_LAYOUT),
          fetchJSON(SITE.carouselFile, DEFAULT_CAROUSEL)
        ]);
        settings = Object.assign({}, DEFAULT_SETTINGS, s);
        homepage = Object.assign({}, DEFAULT_HOMEPAGE, h);
        layout = mergeLayout(l);
        carouselCfg = Object.assign({}, DEFAULT_CAROUSEL, cr);

        // 只在真的和缓存不同才重画，避免页面无谓闪动。
        // 注意 cache 可能是 null（没有缓存 / 隐私模式），取值要先兜住。
        const cachedTriple = cache
          ? [cache.settings || {}, cache.homepage || {}, cache.layout || {}, cache.carousel || {}]
          : null;
        const changed = !showedCache || !cachedTriple ||
          JSON.stringify([s, h, l, cr]) !== JSON.stringify(cachedTriple);
        if (changed) {
          applySettings(settings);
          applyHomepage(homepage, settings);
          applyLayout(layout);
          applyTokens(layout.tokens, settings);
          // 轮播的文字配置也可能变了 —— 但要等 posts 到手才重建（见下面 render）
        }

        try {
          posts = await fetchPosts(settings.posts_dir || 'content/notes');
          const limit = parseInt(settings.posts_limit, 10) || 0;
          if (limit > 0) posts = posts.slice(0, limit);

          let activeTag = '全部';
          const render = () => {
            renderPosts(posts, settings, activeTag);
            feed.classList.remove('from-cache');
            renderTagBar(posts, settings, activeTag, (tag) => { activeTag = tag; render(); });
            if (IS_DESIGNER) postToParent({ type: 'designer:rendered' });
          };
          render();
          // 轮播不跟着标签筛选走：它是一个独立的作品橱窗，
          // 点标签只影响下方内容流，否则「轮播图突然空了」会很突兀。
          renderCarousel(posts, carouselCfg);

          // 存起来给下次访问用（只存能序列化的数据）
          writeCache(s, h, l, posts, cr);

          // 内容与轮播都到位了，区块高度才稳定 —— 这时才谈得上把 #feed 锚点对准确
          syncFeedAnchor();
          scrollToFeedIfHashed();
        } catch (postErr) {
          // 文章拉失败：如果缓存已经顶上去了，就安静保留缓存内容；
          // 否则才展示错误，让主人知道要检查什么。
          console.error(postErr);
          if (showedCache) {
            console.warn('远端文章更新失败，继续展示本地缓存内容');
          } else {
            feed.innerHTML = `<div class="status-box">
              <p><strong>内容同步失败</strong></p>
              <p>${escapeHtml(postErr.message)}</p>
              <p style="margin-top:10px;font-size:0.82rem">检查要点：仓库为公开仓库 · 分支名 <code>${escapeHtml(SITE.branch)}</code> · 内容目录 <code>${escapeHtml(settings.posts_dir)}</code></p>
            </div>`;
          }
        }
      } catch (err) {
        console.error(err);
        if (!showedCache) {
          feed.innerHTML = `<div class="status-box">
            <p><strong>内容同步失败</strong></p>
            <p>${escapeHtml(err.message)}</p>
          </div>`;
        }
      }

      feed.classList.add('is-ready');

      // marked / DOMPurify 若还没到位，等它们回来再补渲染一次（自动，无需刷新）
      retryRenderWhenLibsReady();

      // 通知编辑器：画布已就绪，可以开始拖拽了
      postToParent({
        type: 'designer:ready',
        blocks: Array.from(document.querySelectorAll('[data-block]')).map((el) => el.dataset.block),
        layout: layout
      });
    })();
  </script>
</body>
</html>
