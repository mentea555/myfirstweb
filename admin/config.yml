backend:
  name: github
  repo: mentea555/myfirstweb
  branch: main
  base_url: https://www.menteaweb.com
  auth_endpoint: /api/auth

# 后台展示与媒体库
site_url: https://www.menteaweb.com
display_url: https://www.menteaweb.com
media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  # ==================== 内容：笔记与作品 ====================
  - name: "notes"
    label: "笔记与作品"
    label_singular: "一篇内容"
    description: "在这里写的内容，保存后会立即出现在网站首页的卡片流里。"
    folder: "content/notes"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "标题", name: "title", widget: "string", hint: "卡片上显示的大标题" }
      - { label: "发布日期", name: "date", widget: "datetime", hint: "决定卡片排序，最新的排在最前" }
      - {
          label: "摘要（可选）",
          name: "description",
          widget: "text",
          required: false,
          hint: "显示在标题下方的一句话简介",
        }
      - {
          label: "封面图/作品图（可选）",
          name: "thumbnail",
          widget: "image",
          required: false,
          hint: "推荐点「上传」把图片存进本站仓库（assets/images），最稳也最快。若填外链：GitHub 的链接会自动换成 jsDelivr；其他图床（如 imgbb）在部分网络下可能加载不出来，前台会先直连、失败后自动改用图片代理兜底一次。",
        }
      - {
          label: "标签（可选）",
          name: "tags",
          widget: "list",
          required: false,
          hint: "例如：插画、随笔。前台会自动生成标签筛选按钮",
        }
      - { label: "置顶", name: "featured", widget: "boolean", default: false, required: false }
      - {
          label: "存为草稿（不在前台显示）",
          name: "draft",
          widget: "boolean",
          default: false,
          required: false,
        }
      - {
          label: "正文内容",
          name: "body",
          widget: "richtext",
          buttons: ["bold", "italic", "strikethrough", "code", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"],
          modes: ["rich_text", "raw"],
          editor_components: ["image", "code-block"],
          hint: "想给某段文字上色：先选中那几句话，再点工具栏最右边的「🎨 颜色」按钮选色。文字会变成 {{<c:#ff7a7a>}}像这样{{</c>}} 的标记（这是正常的，发布到网站后就是彩色字）。想撤掉就把带颜色的那段重新选中，点「无」。（另外，编辑器里粉色高亮只是它自带的样式，与文字颜色无关）",
        }

  # ==================== 前端页面设置（改前端的工具） ====================
  - name: "pages"
    label: "前端页面设置"
    description: "改文案在这里；调整页面布局、配色和间距，请点右下角「🎨 可视化布局编辑器」，拖一下就好。"
    files:
      - name: "homepage"
        label: "首页内容"
        file: "content/homepage.json"
        fields:
          - {
              label: "顶部小标签",
              name: "hero_badge",
              widget: "string",
              required: false,
              hint: "首页大标题上方的小胶囊文字，留空则不显示",
            }
          - {
              label: "首页大标题",
              name: "hero_title",
              widget: "string",
              required: false,
              hint: "留空则自动使用「全站设置」里的站点标题",
            }
          - { label: "首页副标题", name: "hero_subtitle", widget: "string", required: false }
          - {
              label: "公告条",
              name: "announcement",
              widget: "markdown",
              required: false,
              hint: "显示在页面最顶部，支持 Markdown。留空则不显示",
            }
          - { label: "显示「关于我」板块", name: "about_enabled", widget: "boolean", default: true, required: false }
          - { label: "板块标题", name: "about_title", widget: "string", required: false }
          - { label: "板块正文", name: "about_body", widget: "markdown", required: false }
          - { label: "页脚文字", name: "footer_text", widget: "markdown", required: false }

      - name: "settings"
        label: "全站基础设置"
        file: "content/settings.json"
        fields:
          - { label: "站点标题", name: "site_title", widget: "string", hint: "浏览器标签页与页头左上角的名字" }
          - { label: "站点副标题", name: "site_subtitle", widget: "string", required: false }
          - {
              label: "配色模式",
              name: "theme_mode",
              widget: "select",
              options: [{ label: "暗色（默认）", value: "dark" }, { label: "亮色", value: "light" }],
              default: "dark",
              hint: "用右下角的「可视化布局编辑器」调整可以边改边看效果",
            }
          - {
              label: "主题强调色",
              name: "accent_color",
              widget: "color",
              default: "#6366f1",
              allowInput: true,
              hint: "按钮、标签、链接的强调色，可直接粘贴色号如 #6366f1",
            }
          - {
              label: "页面背景色（可选）",
              name: "background_color",
              widget: "color",
              required: false,
              allowInput: true,
              hint: "留空则跟随配色模式的默认背景",
            }
          - {
              label: "标题与强调文字颜色（可选）",
              name: "heading_color",
              widget: "color",
              required: false,
              allowInput: true,
              hint: "留空 = 跟随配色模式默认。改完记得看下和背景的对比度够不够",
            }
          - {
              label: "正文段落颜色（可选）",
              name: "body_color",
              widget: "color",
              required: false,
              allowInput: true,
              hint: "留空 = 跟随配色模式默认",
            }
          - {
              label: "一般文字颜色（可选）",
              name: "text_color",
              widget: "color",
              required: false,
              allowInput: true,
              hint: "留空 = 跟随配色模式默认",
            }
          - {
              label: "次要文字颜色（日期等，可选）",
              name: "dim_color",
              widget: "color",
              required: false,
              allowInput: true,
              hint: "留空 = 跟随配色模式默认",
            }
          - {
              label: "首屏徽标文字颜色（可选）",
              name: "badge_color",
              widget: "color",
              required: false,
              allowInput: true,
              hint: "首屏那个小圆角标签（如「不可见的滚木」）的文字色。留空 = 按强调色自动算一个看得清的",
            }
          - {
              label: "正文里的链接颜色（可选）",
              name: "link_color",
              widget: "color",
              required: false,
              allowInput: true,
              hint: "留空 = 跟随强调色；强调色太暗时会自动换成能看清的颜色",
            }
          - {
              label: "字体",
              name: "font_family",
              widget: "select",
              options: [
                { label: "无衬线（默认）", value: "jakarta" },
                { label: "系统字体", value: "system" },
                { label: "衬线体", value: "serif" },
                { label: "等宽体", value: "mono" },
              ],
              default: "jakarta",
            }
          - {
              label: "内容区最大宽度（px）",
              name: "page_width",
              widget: "number",
              value_type: "int",
              default: 900,
              min: 600,
              max: 1400,
              hint: "以上这几项外观设置，在可视化编辑器里改会更直观",
            }
          - { label: "显示「管理后台」按钮", name: "show_admin_button", widget: "boolean", default: true }
          - { label: "按钮文字", name: "admin_button_text", widget: "string", default: "管理后台 →", required: false }
          - {
              label: "顶部导航链接",
              name: "nav_links",
              widget: "list",
              required: false,
              fields: [
                { label: "名称", name: "label", widget: "string" },
                { label: "链接", name: "url", widget: "string" },
              ],
            }
          - {
              label: "内容目录",
              name: "posts_dir",
              widget: "string",
              default: "content/notes",
              hint: "文章 md 文件所在目录，非必要不要修改",
            }
          - {
              label: "首页最多显示条数",
              name: "posts_limit",
              widget: "number",
              value_type: "int",
              default: 0,
              min: 0,
              hint: "填 0 表示全部显示",
            }
          - { label: "显示标签筛选", name: "show_tags", widget: "boolean", default: true }
          - {
              label: "显示右上角悬浮按钮",
              name: "float_buttons_enabled",
              widget: "boolean",
              default: true,
              required: false,
              hint: "总开关。关掉后下面两个按钮都不显示",
            }
          - {
              label: "① 首页按钮",
              name: "float_home_enabled",
              widget: "boolean",
              default: true,
              required: false,
              hint: "固定在屏幕右上角、滚动时不动",
            }
          - {
              label: "　　首页按钮链接",
              name: "float_home_url",
              widget: "string",
              default: "/",
              required: false,
              hint: "一般不用改，/ 就是站点首页",
            }
          - {
              label: "　　首页按钮悬停提示",
              name: "float_home_label",
              widget: "string",
              default: "回到首页",
              required: false,
            }
          - {
              label: "② 关于我按钮（跳转到个人介绍页）",
              name: "float_link_enabled",
              widget: "boolean",
              default: true,
              required: false,
              hint: "指向本站的 /about/ 页面，就是在「关于我页面」里编辑的那个",
            }
          - {
              label: "　　关于我按钮网址",
              name: "float_link_url",
              widget: "string",
              default: "/about/",
              required: false,
              hint: "默认指向本站的「关于我」页面 /about/。改成别的网址也行；留空则会自动隐藏这个按钮，不会留个点了没反应的死按钮",
            }
          - {
              label: "　　关于我按钮悬停提示",
              name: "float_link_label",
              widget: "string",
              default: "关于我",
              required: false,
            }
          - {
              label: "自定义 CSS",
              name: "custom_css",
              widget: "code",
              required: false,
              default: "",
              output_code_only: true,
              allow_language_selection: false,
              hint: "高级：直接注入样式表，例如改圆角、阴影、卡片间距",
            }
          - {
              label: "自定义 head 代码",
              name: "custom_head",
              widget: "code",
              required: false,
              default: "",
              output_code_only: true,
              allow_language_selection: false,
              hint: "高级：可插入统计脚本、自定义 meta 等",
            }

      # ==================== 关于我页面（个人介绍） ====================
      - name: "about"
        label: "关于我页面"
        file: "content/about.json"
        description: "这个页面的网址是 /about/（右上角悬浮按钮会跳到这里）。头像、简介、下方的那排图标链接都在这里改。"
        fields:
          - {
              label: "头像",
              name: "avatar",
              widget: "image",
              required: false,
              hint: "推荐点「上传」把图片存进本站仓库（assets/images），最稳也最快。不填则显示名字首字母的圆形占位。",
            }
          - {
              label: "头像替代文字（无障碍）",
              name: "avatar_alt",
              widget: "string",
              required: false,
              default: "我的头像",
              hint: "给读屏软件用，可以不填",
            }
          - {
              label: "显示名字",
              name: "display_name",
              widget: "string",
              default: "Mentea",
              hint: "页面上最大的那个名字",
            }
          - {
              label: "一句话简介",
              name: "tagline",
              widget: "string",
              required: false,
              hint: "名字下方的小字，例如「画画的、写字的」。留空则不显示",
            }
          - {
              label: "自我介绍",
              name: "bio",
              widget: "markdown",
              required: false,
              hint: "支持换行、**加粗**、（链接）等写法。想给文字上色可先在主站文章里试好格式再粘过来。",
            }
          - label: "图标链接（下方那一排）"
            name: "links"
            widget: "list"
            required: false
            label_singular: "一个链接"
            summary: "{{fields.label}} → {{fields.url}}"
            hint: "点「+ 添加一个链接」增加，拖动左侧圆点可调整顺序。图标从下拉里选即可。"
            fields:
              - { label: "名称", name: "label", widget: "string", hint: "显示在图标右边的文字，例如「B 站」" }
              - { label: "网址", name: "url", widget: "string", hint: "完整网址，需要以 https:// 开头" }
              - {
                  label: "图标",
                  name: "icon",
                  widget: "select",
                  default: "link",
                  options:
                    [
                      { label: "B 站", value: "bilibili" },
                      { label: "osu!", value: "osu" },
                      { label: "GitHub", value: "github" },
                      { label: "邮箱", value: "mail" },
                      { label: "X / Twitter", value: "twitter" },
                      { label: "微博", value: "weibo" },
                      { label: "YouTube", value: "youtube" },
                      { label: "QQ", value: "qq" },
                      { label: "Pixiv", value: "pixiv" },
                      { label: "Telegram", value: "telegram" },
                      { label: "Discord", value: "discord" },
                      { label: "网易云音乐", value: "music" },
                      { label: "Steam", value: "steam" },
                      { label: "通用链接", value: "link" },
                    ],
                }
          - {
              label: "页脚文字",
              name: "footer_text",
              widget: "string",
              required: false,
              hint: "页面最下方的小字，留空则不显示",
            }

      # ==================== 画廊页面（Pinterest 风格图片墙） ====================
      - name: "gallery"
        label: "画廊页面"
        file: "content/gallery.json"
        description: "这个页面的网址是 /gallery/。它以瀑布流图片墙的方式展示作品，点开图片会在右侧显示笔记正文。注意：这里只会收录**打了下面这个标签**的笔记 —— 只是恰好有封面图、但没打标签的不会出现。"
        fields:
          - {
              label: "页面标题",
              name: "title",
              widget: "string",
              default: "画廊",
              hint: "浏览器标签页与页面大标题",
            }
          - {
              label: "页面副标题",
              name: "subtitle",
              widget: "string",
              required: false,
              default: "只收录带插画的笔记",
              hint: "标题下方的小字，留空则不显示",
            }
          - {
              label: "★ 收录标签",
              name: "tag",
              widget: "string",
              default: "插画",
              hint: "只有打了这个标签的笔记才会出现在画廊里。在「笔记与作品」里给文章加这个标签即可。改这里就能换一个标签（例如改成「作品」）。",
            }
          - {
              label: "空画廊时的提示文字",
              name: "empty_text",
              widget: "text",
              required: false,
              hint: "还没有任何笔记打上这个标签时显示的话。可以换行。",
            }
