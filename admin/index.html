<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>内容管理后台 | Mentea's Web</title>
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    #boot {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; color: #64748b; font-size: 14px; line-height: 1.8; text-align: center;
    }
    /* 右下角入口：跳到可视化布局编辑器 */
    #designer-entry {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 99999;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 18px;
      border-radius: 999px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #fff !important;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .2px;
      box-shadow: 0 6px 22px rgba(99, 102, 241, .45);
      transition: transform .18s ease, box-shadow .18s ease;
    }
    #designer-entry:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(99, 102, 241, .58);
    }
    #designer-entry .ic { font-size: 15px; line-height: 1; }
  </style>
</head>
<body>
  <div id="boot">
    正在加载内容管理后台...<br />
    <span id="bootHint">如果 15 秒后还停在这一步，可以点下面的按钮换个线路重试。</span>
    <br /><br />
    <button id="bootRetry" style="display:none;padding:9px 18px;border:0;border-radius:8px;background:#6366f1;color:#fff;font-size:13px;font-weight:600;cursor:pointer;">
      换线路重试
    </button>
  </div>

  <a id="designer-entry" href="/admin/designer/">
    <span class="ic">🎨</span>
    <span>可视化布局编辑器</span>
  </a>

  <script>
    /*
     * 「🎨 文字颜色」按钮：给正文编辑器（richtext）的工具栏补一个调色按钮。
     *
     * 为什么不用 Decap 官方 API：richtext 的 buttons 白名单里没有颜色，
     * 也没有「行内工具栏按钮」的注册接口。所以这里用 MutationObserver
     * 等工具栏渲染出来，再往里 append 一个原生按钮，点一下就把选中的
     * 文字包成短代码 {{<c:#ff7a7a>}}…{{</c>}}，前台渲染时还原成彩色文字。
     *
     * 这个文件独立放在 /admin/color-button.js，改它不影响后台加载逻辑。
     */
    (function () {
      var s = document.createElement('script');
      s.src = '/admin/color-button.js';
      s.async = true;
      document.head.appendChild(s);
    })();
  </script>

  <script>
    /*
     * ★ 关掉 Decap 的「自动初始化」，改为我们自己按顺序启动。
     *
     * 为什么需要：config.yml 里引用了几样「Decap 自己不认识、由我们现注册」的东西，
     * 而 Decap 是在 CMS.init() 那一刻去查它们注册了没有 —— 查不到就直接配置报错、
     * 后台白屏。但 Decap 主脚本一加载完就会立刻自动 init，抢在中间注册的窗口只有
     * 几毫秒，不可靠。所以设这个标志让它「只挂好 window.CMS、先别启动」。
     *
     * 设了这个标志后，decap-cms 只会挂好 window.CMS 而不启动；等下面把
     * /admin/imgbed-media.js（图床媒体库）和 /admin/tags-widget.js（标签控件）
     * 都加载完，再手动 CMS.init()。
     */
    window.CMS_MANUAL_INIT = true;
  </script>

  <script>
    /*
     * Decap CMS 主脚本体积约 5MB，加载源很关键：
     *   1. unpkg.com 在国内经常很慢，且带 `^` 范围写法会多一次 302 跳转；
     *   2. 这里按 jsDelivr → unpkg(精确版本) → unpkg(范围) 依次回退，
     *      任一加载成功即接管页面，避免单点故障把后台卡死。
     */
    (function () {
      var SRC = {
        jsdelivr: 'https://cdn.jsdelivr.net/npm/decap-cms@3/dist/decap-cms.js',
        unpkgPin: 'https://unpkg.com/decap-cms@3/dist/decap-cms.js',
        unpkgRange: 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js'
      };
      var order = ['jsdelivr', 'unpkgPin', 'unpkgRange'];
      var idx = 0;
      var done = false;
      var timer = null;

      function boot() {
        var el = document.getElementById('boot');
        if (el) el.remove();
        /*
         * CMS 主脚本已就绪，但此刻**还不能**直接 CMS.init()：
         * 必须先把自注册的东西装上，否则 config.yml 里引用了它们的地方
         * 查不到实现，后台会直接配置报错。顺序如下：
         *   ① /admin/imgbed-media.js —— 图床媒体库（media_library.name = imgbed）
         *   ② /admin/tags-widget.js  —— 自定义标签控件（widget: tags）
         *   ③ /admin/auto-date.js    —— 自动日期（不注册任何东西，只监听 DOM 与
         *                               图床上传事件；放在最后，万一挂了也不影响后台）
         */
        loadPlugins(['/admin/imgbed-media.js', '/admin/tags-widget.js', '/admin/auto-date.js'], start);
      }

      /*
       * 顺序加载插件脚本，全部走完（成功或失败都算）再回调。
       * 单个插件挂掉不能拖住整个后台 —— 尤其 imgbed-media.js，它没加载成功时
       * start() 里还有一层兜底注册，保证后台至少能进得去。
       */
      function loadPlugins(list, cb) {
        var i = 0;
        (function step() {
          if (i >= list.length) { cb(); return; }
          var s = document.createElement('script');
          s.src = list[i++];
          s.async = false;
          s.onload = step;
          s.onerror = function () {
            console.warn('[admin] 插件加载失败：' + s.src);
            step();
          };
          document.head.appendChild(s);
        })();
      }

      /* 插件就绪后才真正启动后台 */
      function start() {
        if (!window.__imgbedMediaReady) {
          /*
           * 兜底：图床脚本没跑起来（文件没部署上 / 被拦）时，注册一个同名占位库。
           * 不这么做的话，Decap 会因为「Missing external media library 'imgbed'」
           * 把整个后台打成错误页 —— 宁可上传暂时不可用，也不能让后台进不去。
           */
          try {
            window.CMS.registerMediaLibrary({
              name: 'imgbed',
              init: function () {
                return {
                  show: function () {
                    alert('图床脚本没加载成功，先刷新页面试试。\n如果一直不行，说明 /admin/imgbed-media.js 没部署上去。');
                  },
                  hide: function () {},
                  enableStandalone: function () { return false; }
                };
              }
            });
          } catch (e) {
            console.error(e);
          }
        }
        try {
          window.CMS.init();
        } catch (e) {
          console.error('[admin] CMS.init 失败', e);
          hint('后台启动失败：' + (e && e.message ? e.message : e));
        }
      }

      function hint(text) {
        var el = document.getElementById('bootHint');
        if (el) el.textContent = text;
        var btn = document.getElementById('bootRetry');
        if (btn) btn.style.display = 'inline-block';
      }

      function next() {
        if (done) return;
        if (idx >= order.length) {
          hint('所有线路都没连上，点下面按钮重试。');
          return;
        }
        var key = order[idx++];
        var s = document.createElement('script');
        s.src = SRC[key];
        s.async = false;
        var settled = false;
        timer = setTimeout(function () {
          if (settled || done) return;
          settled = true;
          s.onload = s.onerror = null;
          next();
        }, 12000);
        s.onload = function () {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          if (window.CMS) { done = true; boot(); }
          else next();
        };
        s.onerror = function () {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          next();
        };
        document.head.appendChild(s);
      }

      window.addEventListener('load', function () {
        setTimeout(function () {
          if (!done && !window.CMS) hint('加载有点久，还在尝试换个线路...');
        }, 15000);
      });

      var btn = document.getElementById('bootRetry');
      if (btn) {
        btn.onclick = function () {
          idx = 0; done = false;
          this.style.display = 'none';
          hint('正在重新尝试...');
          next();
        };
      }

      next();
    })();
  </script>
</body>
</html>
