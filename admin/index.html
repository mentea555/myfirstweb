<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>内容管理后台 | Mentea's Web</title>
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    #boot {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; color: #64748b; font-size: 14px; line-height: 1.8; text-align: center;
    }
    /* 右下角入口：跳到可视化布局编辑器 */
    #designer-entry {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 99999;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 18px;
      border-radius: 999px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #fff !important;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .2px;
      box-shadow: 0 6px 22px rgba(99, 102, 241, .45);
      transition: transform .18s ease, box-shadow .18s ease;
    }
    #designer-entry:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(99, 102, 241, .58);
    }
    #designer-entry .ic { font-size: 15px; line-height: 1; }
  </style>
</head>
<body>
  <div id="boot">
    正在加载内容管理后台...<br />
    如果长时间没有反应，请检查浏览器是否拦截了 unpkg.com 的脚本。
  </div>

  <a id="designer-entry" href="/admin/designer/">
    <span class="ic">🎨</span>
    <span>可视化布局编辑器</span>
  </a>

  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // 脚本加载成功后，Decap 会自行接管页面，移除提示层
    if (window.CMS) {
      var boot = document.getElementById("boot");
      if (boot) boot.remove();
    }
  </script>
</body>
</html>
